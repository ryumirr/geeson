spring:
  datasource:
    url: jdbc:mysql://mysql:3306/order_db
    username: root
    password: "rootpass^^*"
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: order-consumer-group
      auto-offset-reset: earliest
    listener:
      ack-mode: record
      missing-topics-fatal: false

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://redis:6379"
          connectionMinimumIdleSize: 5
          connectionPoolSize: 10
        threads: 4
        nettyThreads: 4
grpc:
  server:
    port: 6565
    address: 0.0.0.0
  clients:
    inventory-api:
      address: inventory-api:6566
      negotiationType: plaintext
      enableKeepAlive: true

api:
  version: '2025-05-25'

uuid:
  node-id: ${NODE_ID:0}

server:
  port: 9093
