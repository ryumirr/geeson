syntax = "proto3";

package grpc.purchaseorder;
option java_package = "grpc.purchaseorder";
option java_multiple_files = true;

// ===== Service =====
service PurchaseOrderService {
  // 신규 발주 등록
  rpc AddPurchaseOrder(AddPurchaseOrderRequest) returns (AddPurchaseOrderResponse);

  // 단일 발주 조회
  rpc SelectPurchaseOrder(SelectPurchaseOrderRequest) returns (SelectPurchaseOrderResponse);

  // 다중 발주 조회
  rpc SelectPurchaseOrders(SelectPurchaseOrdersRequest) returns (SelectPurchaseOrdersResponse);

  // 발주 상태 갱신 (예: APPROVED, CANCELLED)
  rpc UpdatePurchaseOrderStatus(UpdatePurchaseOrderStatusRequest) returns (UpdatePurchaseOrderStatusResponse);
}

// ===== Entities =====
message PurchaseOrder {
  int64 purchaseOrderId = 1;
  int64 supplierId = 2;
  int64 warehouseId = 3;
  string orderDate = 4;
  string status = 5;
  double totalAmount = 6;
  string createdAt = 7;
  string updatedAt = 8;
}

// ===== Add =====
message AddPurchaseOrderRequest {
  int64 supplierId = 1;
  int64 warehouseId = 2;
  string orderDate = 3;
  string status = 4;
  double totalAmount = 5;
}

message AddPurchaseOrderResponse {
  PurchaseOrder purchaseOrder = 1;
}

// ===== Select (Single) =====
message SelectPurchaseOrderRequest {
  int64 purchaseOrderId = 1;
}

message SelectPurchaseOrderResponse {
  PurchaseOrder purchaseOrder = 1;
}

// ===== Select (Bulk) =====
message SelectPurchaseOrdersRequest {
  repeated int64 purchaseOrderIds = 1; // 조회할 발주 ID 목록
}

message SelectPurchaseOrdersResponse {
  repeated PurchaseOrder purchaseOrders = 1;
}

// ===== Update Status =====
message UpdatePurchaseOrderStatusRequest {
  int64 purchaseOrderId = 1;
  string status = 2;
}

message UpdatePurchaseOrderStatusResponse {
  bool success = 1;
  PurchaseOrder purchaseOrder = 2;
}
