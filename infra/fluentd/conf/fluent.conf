<source>
  @type tail
  path /var/log/app/*.log        # ✅ 모든 .log 파일 추적
  pos_file /fluentd/logs/app.pos
  tag geeson.app
  format none                    # 단순 텍스트면 none
  read_from_head true
</source>

<filter geeson.app>
  @type record_transformer
  enable_ruby true
  <record>
    hostname "#{Socket.gethostname}"
    app "geeson"
  </record>
</filter>

<match geeson.app>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  include_tag_key true
  reconnect_on_error true
  request_timeout 30s
  <buffer>
    flush_interval 5s
  </buffer>
</match>
